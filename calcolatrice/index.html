<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="calcolatrice.css">

    <script type="module" src="calcolatrice_objects.js"></script>

    <title>Calcolatrice</title>

</head>

<body>
    <input id="change_calc" onclick="changeCalculator()" type="button" value="Normal" class="change_calculator">
    <div class="all">
        <div class="calculator">
            <div class="span"><span id="span">0</span></div>
            <input type="button" value="√" class="scientific">
            <input type="button" value="^" class="scientific">
            <input type="button" value="log" class="scientific">
            <input type="button" value="𝑒" class="scientific">
            <input type="button" value="sin" class="scientific">
            <input type="button" value="cos" class="scientific">
            <input type="button" value="tan" class="scientific">
            <input type="button" value="π" class="scientific">
            <input type="button" value="|" class="scientific">
            <input type="button" value="rand" class="scientific">
            <input type="button" value="floor" class="scientific">
            <input type="button" value="ceil" class="scientific">
            <input type="button" value="CE" id="CE">
            <input type="button" value="(" class="nonScientific">
            <input type="button" value=")" class="nonScientific">
            <input type="button" value="←" id="back">
            <input type="button" value="1" class="nonScientific">
            <input type="button" value="2" class="nonScientific">
            <input type="button" value="3" class="nonScientific">
            <input type="button" value="+" class="nonScientific">
            <input type="button" value="4" class="nonScientific">
            <input type="button" value="5" class="nonScientific">
            <input type="button" value="6" class="nonScientific">
            <input type="button" value="-" class="nonScientific">
            <input type="button" value="7" class="nonScientific">
            <input type="button" value="8" class="nonScientific">
            <input type="button" value="9" class="nonScientific">
            <input type="button" value="×" class="nonScientific">
            <input type="button" value="0" class="nonScientific">
            <input type="button" value="." class="nonScientific">
            <input type="button" value="=" id="enter">
            <input type="button" value=":" class="nonScientific">
        </div>
    </div>
</body>

</html>
